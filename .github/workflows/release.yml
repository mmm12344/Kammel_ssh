name: Release

# Builds the release APK and publishes it as a GitHub Release — the same
# pipeline `scripts/release.sh` runs locally, moved to CI so a release does
# not need Flutter (or a Gradle/JDK setup) on the machine that asks for it.
#
# The in-app updater (lib/services/update_service.dart) reads /releases/latest
# and installs the first asset whose name ends in .apk, so this workflow is
# what "the app updates itself" actually rides on.
#
# Run it from the Actions tab after landing the version's entry in
# lib/models/changelog.dart (or pass custom notes to skip that requirement —
# the same escape hatch release.sh has via RELEASE_NOTES).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump: patch | minor | major | exact X.Y.Z'
        required: false
        default: 'patch'
      notes:
        description: 'Optional release notes (markdown). Overrides the changelog entry.'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        required: false
        default: false

# Two releases racing would double-bump the build number.
concurrency:
  group: release
  cancel-in-progress: false

# Push the version-bump commit and create the release/tag.
permissions:
  contents: write

jobs:
  release:
    name: build APK & publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # android/app/build.gradle.kts builds with Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Resolve the next version
        id: ver
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          line=$(grep '^version:' pubspec.yaml | head -1)
          current=${line#version: }
          name=${current%%+*}
          build=${current#*+}
          IFS='.' read -r major minor patch <<<"$name"

          case "$VERSION_INPUT" in
            patch) patch=$((patch + 1)) ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
            *.*.*) IFS='.' read -r major minor patch <<<"$VERSION_INPUT" ;;
            *) echo "error: unknown version '$VERSION_INPUT' (use patch|minor|major|X.Y.Z)" >&2; exit 1 ;;
          esac

          new_name="${major}.${minor}.${patch}"
          # Continue the monotonic versionCode from pubspec, never run_number:
          # existing installs already carry build 74+, and a lower versionCode
          # would make the updater's install fail as a downgrade.
          new_build=$((build + 1))
          echo "==> ${current} -> ${new_name}+${new_build}"
          echo "name=${new_name}" >> "$GITHUB_OUTPUT"
          echo "build=${new_build}" >> "$GITHUB_OUTPUT"
          echo "tag=v${new_name}" >> "$GITHUB_OUTPUT"

      - name: Guard — the release must not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "error: release ${{ steps.ver.outputs.tag }} already exists on GitHub" >&2
            exit 1
          fi

      - name: Guard — the changelog must describe this version (unless notes were given)
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$NOTES" ]; then
            echo "custom notes provided — skipping the changelog check"
            exit 0
          fi
          python3 scripts/changelog_notes.py --check "${{ steps.ver.outputs.name }}"

      - name: flutter test
        run: |
          flutter pub get
          flutter test

      - name: Bump pubspec version
        run: |
          sed -i.bak "s/^version: .*/version: ${{ steps.ver.outputs.name }}+${{ steps.ver.outputs.build }}/" pubspec.yaml
          rm -f pubspec.yaml.bak
          grep '^version:' pubspec.yaml

      - name: Build the release APK
        run: flutter build apk --release

      - name: Commit the version bump
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "release: ${{ steps.ver.outputs.name }}+${{ steps.ver.outputs.build }}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > release_notes.md
          else
            # English by construction, generated from the same table the app's
            # NOVEDADES screen shows — the body a user reads before installing
            # always matches what the app will tell them afterwards.
            python3 scripts/changelog_notes.py "${{ steps.ver.outputs.name }}" > release_notes.md
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "${{ steps.ver.outputs.tag }}" \
            --notes-file release_notes.md \
            --target "${{ steps.commit.outputs.sha }}" \
            ${{ inputs.prerelease && '--prerelease' || '' }}
